<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’Ultima Parola</title>
<style>
:root{--bg:#ffffff;--fg:#1c1b22;--card:#f1f0f7;--mut:#6b6a78;--acc:#5b4bdb;--ok:#1f9d55;--bad:#d64545;--box:#ffffff;--line:#d9d7e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141b;--fg:#f1f0f7;--card:#22212c;--mut:#a09fb0;--acc:#8b7dff;--ok:#3ecf80;--bad:#ff6b6b;--box:#2b2a37;--line:#3a3949;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141b;--fg:#f1f0f7;--card:#22212c;--mut:#a09fb0;--acc:#8b7dff;--ok:#3ecf80;--bad:#ff6b6b;--box:#2b2a37;--line:#3a3949;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.7rem;margin:8px 0 4px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 20px}
[hidden]{display:none!important}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--box);color:var(--fg);font-size:1rem;margin-bottom:12px}
.seg{display:flex;gap:10px}
.seg label{flex:1;margin:0;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--box);color:var(--fg);font-size:1rem;cursor:pointer}
.seg input{display:none}
.seg input:checked+span{font-weight:700;color:var(--acc)}
.seg label:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:6px}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.pls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pl{background:var(--card);border-radius:16px;padding:14px;text-align:center;border:3px solid transparent;opacity:.65}
.pl.on{border-color:var(--acc);opacity:1}
.pl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tm{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.pl .tm.low{color:var(--bad)}
.def{font-size:1.25rem;text-align:center;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.word{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.b{width:clamp(24px,7vw,44px);height:clamp(34px,10vw,56px);display:flex;align-items:center;justify-content:center;background:var(--box);border:2px solid var(--line);border-radius:8px;font-size:clamp(1.1rem,4vw,1.7rem);font-weight:800}
.word.ok .b{border-color:var(--ok);color:var(--ok)}
.word.bad .b{border-color:var(--bad);color:var(--bad)}
#mic{text-align:center;color:var(--mut);font-size:.9rem;margin:6px 0 10px}
.win{font-size:1.6rem;text-align:center;font-weight:800;margin:10px 0}
</style>
</head>
<body>
<main>
<h1>⏱️ L’Ultima Parola</h1>
<p class="sub">Indovina la parola prima che scada il tempo</p>

<section id="setup">
  <div class="card">
    <label for="n1">Giocatore 1</label>
    <input type="text" id="n1" placeholder="Inserisci nome" maxlength="16">
    <label for="n2">Giocatore 2</label>
    <input type="text" id="n2" placeholder="Inserisci nome" maxlength="16">
    <label>Tempo a testa</label>
    <div class="seg">
      <label><input type="radio" name="t" value="45" checked><span>45 secondi</span></label>
      <label><input type="radio" name="t" value="60"><span>60 secondi</span></label>
    </div>
  </div>
  <button id="go">Start</button>
  <p class="sub" style="margin-top:14px">Consenti il microfono quando il browser lo chiede. Funziona meglio con Chrome o Edge.</p>
</section>

<section id="game" hidden>
  <div class="pls">
    <div class="pl" id="c0"><div class="nm" id="p0"></div><div class="tm" id="t0"></div></div>
    <div class="pl" id="c1"><div class="nm" id="p1"></div><div class="tm" id="t1"></div></div>
  </div>
  <div class="card">
    <div class="def" id="def"></div>
    <div class="word" id="word"></div>
  </div>
  <div id="mic"></div>
  <div id="src" style="text-align:center;color:var(--mut);font-size:.8rem;margin-bottom:10px"></div>
  <div id="heard" style="text-align:center;color:var(--mut);font-size:.85rem;min-height:1.4em;margin-bottom:8px"></div>
  <input type="text" id="ans" placeholder="Oppure scrivi la parola e premi Invio" autocomplete="off">
</section>

<section id="end" hidden>
  <div class="card">
    <div class="win" id="winner"></div>
    <div class="def" id="last" style="min-height:0"></div>
    <div class="word bad" id="lastword"></div>
  </div>
  <button id="again">Rivincita</button>
  <button class="alt" id="back">Cambia impostazioni</button>
</section>
</main>

 alle feste;regalo|Si dona a Natale o al compleanno;coriandoli|Pezzetti di carta colorata a Carnevale;maschera|Copre il volto a Carnevale;presepe|Rappresenta la nascita di Gesù;befana|Vecchietta che porta doni il sei gennaio;carnevale|Festa di maschere;vendemmia|Raccolta dell’uva;mietitura|Taglio del grano maturo;aratro|Attrezzo per rivoltare la terra;fienile|Dove si conserva il fieno;scuderia|Stalla dei cavalli;pollaio|Casa delle galline;recinto|Serve a chiudere un terreno;mulino|Macina il grano;forno|Cuoce il pane;granaio|Magazzino dei cereali;vigneto|Terreno coltivato a viti;frantoio|Dove si spreme l’olio;cantina|Dove si conserva il vino;botte|Contenitore di legno per il vino;bottiglia|Contenitore di vetro per i liquidi;tricolore|Bandiera italiana;gondoliere|Guida la gondola").split(";").map(x=>x.trim().split("|")).filter(p=>p.length===2));
const $=id=>document.getElementById(id);
let queue=[],fetching=false,sampleFn=null,sampleTried=false,nextTry=0,seen=new Set();
try{seen=new Set(JSON.parse(localStorage.getItem("up_seen")||"[]"))}catch(_){}
const TOPICS=["animali","natura","geografia","storia","cucina","sport","musica","scienza","tecnologia","mestieri","arte","oggetti di casa","mare e navigazione","corpo umano","viaggi","cinema e teatro","letteratura","matematica","trasporti","feste e tradizioni","abbigliamento","architettura","meteo","spazio","economia","diritto","vita quotidiana","mitologia","medicina","giochi","piante","strumenti da lavoro","emozioni","scuola","citt\u00e0 e paesi"];
function setSrc(t){const el=document.getElementById("src");if(el)el.textContent=t}
async function refill(){
  if(fetching||Date.now()<nextTry)return;
  fetching=true;
  try{
    if(!sampleTried){sampleTried=true;sampleFn=(window.claude&&claude.use)?await claude.use("sample"):null}
    if(!sampleFn){setSrc("Parole: solo elenco base (Claude non disponibile in questa pagina)");return}
    const tp=shuffle(TOPICS.slice()).slice(0,5).join(", ");
    const lt=shuffle("abcdefghilmnopqrstuvz".split("")).slice(0,8).join(", ");
    const data=await sampleFn.json(
"Sei l\u2019autore di un quiz tipo \u201cL\u2019Ultima Parola\u201d de L\u2019Eredit\u00e0. Genera 30 voci diverse tra loro.\n"+
"Ogni voce: una parola italiana (sostantivo o aggettivo, non nome proprio) di 5-13 lettere, senza spazi, apostrofi, trattini e senza lettere accentate, pi\u00f9 una definizione breve (3-9 parole) che aiuti a indovinarla senza contenere la parola n\u00e9 la sua radice.\n"+
"Difficolt\u00e0 mista: circa 35% facili, 40% medie, 25% difficili (meno comuni ma note).\n"+
"Ambiti da usare soprattutto: "+tp+". Includi almeno una parola che inizia con ciascuna di queste lettere: "+lt+".\n"+
"Evita parole troppo banali come casa o libro. Rispondi solo con un array JSON di coppie [\"parola\",\"definizione\"].",
      {cache:false,modelTier:"quick"});
    const arr=Array.isArray(data)?data:(Object.values(data||{}).find(Array.isArray)||[]);
    const out=[];
    arr.forEach(p=>{
      if(!Array.isArray(p)||p.length<2)return;
      const w=norm(String(p[0])).replace(/ /g,""),d=String(p[1]).trim();
      if(!/^[a-z]{5,14}$/.test(w)||d.length<4||d.length>90)return;
      if(seen.has(w)||out.some(o=>o[0]===w)||WORDS.some(x=>x[0]===w))return;
      if(norm(d).includes(w.slice(0,5)))return;
      out.push([w,d]);
    });
    queue.push(...shuffle(out));setSrc("Parole nuove da Claude pronte: "+queue.length);
  }catch(e){
    if(e&&e.code==="not_granted")sampleFn=null;else nextTry=Date.now()+20000;
    setSrc("Parole: elenco base (Claude: "+((e&&e.code)||"errore")+")");
  }finally{fetching=false}
}
function pick(){
  if(queue.length<12)refill();
  if(queue.length&&Math.random()<0.8){
    const e=queue.shift();seen.add(e[0]);
    try{localStorage.setItem("up_seen",JSON.stringify([...seen].slice(-1500)))}catch(_){}
    return e;
  }
  if(!deck.length)deck=newDeck();
  const e=deck.pop();markUsed(e[0]);return e;
}
function newDeck(){
  let used=[];try{used=JSON.parse(localStorage.getItem("up_used")||"[]")}catch(_){}
  let d=WORDS.filter(w=>!used.includes(w[0]));
  if(!d.length){d=WORDS.slice();try{localStorage.setItem("up_used","[]")}catch(_){}}
  return shuffle(d);
}
function markUsed(w){try{const u=JSON.parse(localStorage.getItem("up_used")||"[]");u.push(w);localStorage.setItem("up_used",JSON.stringify(u))}catch(_){}}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
let names=[],left=[0,0],cur=0,deck=[],word="",def="",shown=[],phase="idle",t0=0,base=0,revealed=0,tick=null,rec=null,recOn=false,micStream=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["setup","game","end"].forEach(s=>$(s).hidden=s!==id)}

function render(){
  for(let i=0;i<2;i++){
    $("t"+i).textContent=(left[i]/1000).toFixed(1);
    $("t"+i).classList.toggle("low",left[i]<10000);
    $("c"+i).classList.toggle("on",cur===i);
  }
  $("def").textContent=def;
  $("word").innerHTML=word.split("").map((c,i)=>'<span class="b">'+(shown[i]?c.toUpperCase():"")+'</span>').join("");
}

function say(txt,cb){
  let done=false;const f=()=>{if(!done){done=true;cb()}};
  if(!window.speechSynthesis){setTimeout(f,2500);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang="it-IT";u.onend=f;u.onerror=f;
  speechSynthesis.speak(u);setTimeout(f,9000);
}

function next(){
  [word,def]=pick();
  shown=word.split("").map((c,i)=>i===0);
  phase="reading";$("word").className="word";$("ans").value="";$("heard").textContent="";
  render();
  say(def,begin);
}

function begin(){
  if(phase!=="reading")return;
  phase="play";t0=performance.now();base=left[cur];revealed=0;
  if(MOBILE&&rec&&recOn){try{rec.start()}catch(_){}}
  tick=setInterval(loop,100);
}

function loop(){
  const el=performance.now()-t0;
  left[cur]=Math.max(0,base-el);
  const want=Math.floor(el/2000);
  while(revealed<want){
    const hidden=[];shown.forEach((s,i)=>{if(!s)hidden.push(i)});
    if(hidden.length<=1)break;
    shown[hidden[Math.floor(Math.random()*hidden.length)]]=true;revealed++;
  }
  render();
  if(left[cur]<=0)finish();
}

function correct(){
  if(phase!=="play")return;
  clearInterval(tick);phase="done";
  shown=shown.map(()=>true);render();$("word").className="word ok";
  setTimeout(()=>{cur=1-cur;next()},1600);
}

function finish(){
  clearInterval(tick);phase="over";
  if(window.speechSynthesis)speechSynthesis.cancel();
  $("winner").textContent="🏆 Vince "+names[1-cur]+"! "+names[cur]+" ha finito il tempo.";
  $("last").textContent=def;
  $("lastword").innerHTML=word.split("").map(c=>'<span class="b">'+c.toUpperCase()+'</span>').join("");
  show("end");
}

const MOBILE=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function close(t){
  const w=t.split(" ").filter(Boolean),tol=word.length>=10?2:word.length>=6?1:0;
  const c=[...w,w.join("")];for(let i=0;i<w.length-1;i++)c.push(w[i]+w[i+1]);
  return c.some(x=>x===word||(tol&&Math.abs(x.length-word.length)<=tol&&lev(x,word)<=tol));
}
function initRec(){
  if(rec&&recOn)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("mic").textContent="Riconoscimento vocale non disponibile qui: usa la casella qui sotto.";return}
  rec=new SR();rec.lang="it-IT";rec.continuous=!MOBILE;rec.interimResults=true;rec.maxAlternatives=5;
  rec.onresult=e=>{
    if(phase!=="play")return;
    for(let i=e.resultIndex;i<e.results.length;i++){
      for(let j=0;j<e.results[i].length;j++){
        const t=norm(e.results[i][j].transcript);
        if(j===0)$("heard").textContent="Sento: "+e.results[i][0].transcript;
        if(close(t)){correct();return}
      }
    }
  };
  rec.onstart=()=>{$("mic").textContent="🎤 Microfono attivo: di’ la parola"};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){recOn=false;$("mic").textContent="Microfono non consentito ("+e.error+"): usa la casella qui sotto."}else if(e.error==="network"){recOn=false;$("mic").textContent="Il riconoscimento vocale non funziona su questo browser (errore di rete). Prova Chrome o Edge, oppure usa la casella qui sotto."}else if(e.error!=="no-speech"&&e.error!=="aborted"){$("mic").textContent="Microfono: errore "+e.error}};
  rec.onend=()=>{if(recOn)setTimeout(()=>{if(recOn&&(!MOBILE||phase==="play")){try{rec.start()}catch(_){}}},300)};
  recOn=true;
  const go=()=>{try{rec.start()}catch(_){}};
  if(!MOBILE&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{micStream=s;go()}).catch(go);else go();
}

function start(){
  names=[$("n1").value.trim()||"Giocatore 1",$("n2").value.trim()||"Giocatore 2"];
  const t=+document.querySelector("input[name=t]:checked").value;
  left=[t*1000,t*1000];cur=0;if(!deck.length)deck=newDeck();
  $("p0").textContent=names[0];$("p1").textContent=names[1];
  show("game");refill();initRec();next();
}

$("go").onclick=start;
$("again").onclick=start;
$("back").onclick=()=>show("setup");
$("ans").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(norm($("ans").value).replace(/ /g,"")===word)correct();
  $("ans").value="";
});
</script>
